<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calculator.css">
    <title>calculator</title>
</head>

<body>
    <div class="calculator" id="calculator">
        <div class="sub-cal">
            <!-- input feild -->
            <div class="input-feild">
                <textarea name="" id="inpu-value" rows="4"></textarea>
            </div>
            <!-- btn groups -->
            <div class="btn-groups">
                <div class="calcu">
                    <button>AC</button>
                    <button>Del</button>
                    <button>%</button>
                    <button>/</button>
                </div>
                <div class="calcu">
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button>*</button>
                </div>
                <div class="calcu">
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button>-</button>
                </div>
                <div class="calcu">
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>+</button>
                </div>
                <div class="calcu">
                    <button>0</button>
                    <button>.</button>
                    <button>=</button>
                </div>
            </div>
        </div>
    </div>

    <script src="calculator.js"></script>
</body>

</html>
